symbol: BTC/USDT
timeframe: 15m
# Higher-timeframe bias, raised 1h -> 4h at explicit user request: scan gold
# and BTC for HIGH-timeframe trades, entered on the low timeframe. The 4h read
# sets direction (SMCStrategy's htf_trend, and screening.py's top-down
# alignment gate); mt5_timeframe below stays the entry timeframe. 1d is the
# next step up if setups should be rarer and larger still.
higher_timeframe: 4h

# Venue: cex (Binance via CCXT) | evm (on-chain DEX) | mt5 (MetaTrader 5 bridge)
venue: mt5

# SMC parameters
swing_lookback: 5
order_block_lookback: 20
fvg_min_size_pct: 0.001
liquidity_tolerance_pct: 0.0005

# Risk management
risk_per_trade_pct: 1.0
reward_risk_ratio: 2.0
max_open_trades: 1

# Fixed stop-loss distance from entry for every live trade, REPLACING the
# order-block/FVG-boundary invalidation stop SMCStrategy would otherwise use
# — set at explicit user request, paired with screening.max_stop_pct below
# (raised from 2% to 25% so the Sniper-entry gate can still pass a 20% stop).
# null/omitted keeps the original structural stop (used by backtests,
# scan.py, and market_snapshot.py's informational second-opinion strategy,
# none of which read this key).
stop_loss_pct: 0.20

# Staged fixed-dollar risk per trade, overriding risk_per_trade_pct above
# when enabled — set at explicit user request: $3/trade while combined
# capital+profit (both venues, via bot/combined_ledger.py) is below
# threshold_usd, $6/trade once it reaches or exceeds it. Recomputed fresh
# every pass against the live combined balance (bot/position_sizing.py's
# staged_fixed_risk_usd/risk_pct_for_fixed_usd).
fixed_risk_usd:
  enabled: true
  low: 3.0
  high: 6.0
  threshold_usd: 100.0

# Paper trading
initial_balance: 10000.0
poll_interval_sec: 30

# EVM settings (when venue: evm)
evm_chain: base
evm_slippage_pct: 0.5

# MT5 settings (when venue: mt5) — connection details go in .env
# Symbol name must match your broker exactly, including any suffix
# (e.g. EURUSD, XAUUSD, BTCUSD, EURUSD.r). Timeframe reuses the same
# strings as above (1m/5m/15m/30m/1h/4h/1d).
# mt5_backend: bridge (default) needs a Windows box running mt5linux, set
#              MT5_HOST/MT5_PORT/MT5_LOGIN/MT5_PASSWORD/MT5_SERVER in .env.
#              metaapi needs no box of your own — set METAAPI_TOKEN plus the
#              same MT5_LOGIN/MT5_PASSWORD/MT5_SERVER in .env.
mt5_backend: bridge
mt5_symbol: EURUSDc
mt5_timeframe: 15m
# Cent account: the broker reports balance/PnL in cents, not dollars
# (100 units = $1). Position sizing is unaffected — tick_value is reported
# in the same cent units, so the risk math is already self-consistent — this
# flag only fixes the human-facing $ balance/PnL printouts.
mt5_cent_account: true
# Symbols to scan every poll cycle (each gets its own position slot; overrides
# mt5_symbol above when set). Confirmed against this account's actual symbol
# list — this broker's Cent account naming uses a trailing "c" suffix.
# US30 (and every other index CFD) is NOT available on Exness Cent accounts —
# checked directly against the account's symbol universe, not just Market
# Watch — so it's left out; it needs a Standard/Zero/Pro account type instead.
# Narrowed to gold and BTC at explicit user request. The four forex pairs and
# ETH are dropped, not deleted — the previous list was:
#   [EURUSDc, USDJPYc, GBPUSDc, GBPJPYc, XAUUSDc, BTCUSDc, ETHUSDc]
# Paired with higher_timeframe: 4h above, this is the HTF-bias / LTF-entry
# scan: 4h sets direction, mt5_timeframe (15m) times the entry.
mt5_watchlist: [XAUUSDc, BTCUSDc]

# Backtest defaults
backtest_bars: 2000

# Hyperliquid DeFi wallet + perps (long/short on one venue)
hyperliquid:
  testnet: false
  default_leverage: 3
  # Majors — PAXG is tokenized gold; XMR is a listed perp (no Monero-chain custody)
  majors: [BTC, ETH, SOL, HYPE, WLD, XMR, PAXG]
  # Sample memecoins (k-prefixed = 1000x-denominated on Hyperliquid)
  memecoins: [kPEPE, WIF, POPCAT, FARTCOIN, TRUMP, DOGE, GOAT, MOODENG, PNUT, kBONK, kSHIB, MELANIA, BRETT]

# Trade screening — a signal must clear ALL of these before it is approved to trade
screening:
  min_confidence: 0.55     # SMC confluence score floor
  min_rr: 2.0              # minimum reward:risk
  sniper_confidence: 0.65  # confidence required for a "sniper" entry
  max_stop_pct: 0.25       # raised from 2% to fit the fixed stop_loss_pct (0.20) above
  ote_low: 0.618           # Fibonacci golden-pocket bounds (OTE zone)
  ote_high: 0.786
  liquidity_tolerance_pct: 0.0005  # equal-high/low tolerance for liquidity pools
  sweep_bars: 20           # a liquidity sweep must be this recent to confirm

# Capital guard — daily-loss / drawdown circuit breaker + concurrent-risk caps.
# Checked right before a --live order is sent; once halted it blocks new
# entries until a new trading day starts or the balance recovers off its peak.
capital_guard:
  max_daily_loss_pct: 3.0
  max_drawdown_pct: 10.0
  max_concurrent_trades: 3
  # Raised from 3.0 at explicit user request: fixed_risk_usd above means a
  # single trade's risk_pct is now $3/combined_balance -- at the account's
  # current ~$8 combined balance that's ~37.5%, which the old 3% cap would
  # have blocked outright (silently, with no trade ever firing). This is a
  # REAL loosening of a capital-preservation control, not a cosmetic
  # change -- max_daily_loss_pct/max_drawdown_pct above are UNCHANGED and
  # still the backstop if a trade goes against the account.
  max_concurrent_open_risk_pct: 40.0
  # Everything below is OFF by default (uncomment to enable) — added for the
  # "self-evolving bot" blueprint's Section 7 breakers. Each is independent;
  # turning one on doesn't change the others' behavior.
  # max_weekly_loss_pct: 6.0             # halts for a fixed 48h once tripped
  # consecutive_loss_limit: 3            # halves new-trade size until 2 wins in a row
  # vix_halt_threshold: 30.0             # needs `vix=` passed into CapitalGuard.update()
  # correlated_crash_btc_pct: -5.0       # both this AND spx_pct must trip together
  # correlated_crash_spx_pct: -3.0
  # liquidity_shock_spread_pct: 0.1
  # liquidity_shock_volume_drop_pct: -50.0
  # profit_lock_trigger_pct: 20.0        # check_profit_lock() reports a lock amount; a human executes the move
  # profit_lock_fraction: 0.10

# --- Extended SMC detectors (bot/smc/{breaker,mitigation,candles,volume_profile}.py)
# Four detectors added for the concepts the ingested corpus discusses most but
# nothing in bot/smc/ modelled. They REFINE the confidence of a setup the
# existing confluence gate already approved — they are not extra points in that
# gate's score, so they cannot push a sub-threshold setup over the entry bar and
# manufacture a trade. extended_max_adjust bounds the refinement in BOTH
# directions; the upward bound is the one that matters, since confidence feeds
# final_pct and final_pct decides unattended auto-fire.
# OFF: analyze() returns bit-identical signals to before these existed.
smc:
  extended_detectors: true
  extended_max_adjust: 0.10

# --- Knowledge confluence (bot/knowledge.py)
# Scores a live setup against the ingested transcript corpus (~1000 documents),
# joining on the `maps_to` module names the corpus already carries. ADVISORY
# ONLY: it moves final_pct by at most max_adjust_pct and can never change
# whether a trade is approved. The corpus is unvetted third-party commentary
# and does not get a vote on real orders.
# corpus_path is relative to the working directory; the live checkout reaches
# it through the `knowledge` symlink, which is NOT tracked in git, so set an
# absolute path for any checkout that lacks it.
# OFF: final_pct is computed exactly as before.
knowledge:
  enabled: true
  corpus_path: knowledge/corpus.json
  cache_path: .knowledge_weights.json
  max_adjust_pct: 5.0

# --- Adaptive position sizing (bot/position_sizing.py)
# Activates the regime / hotness / volatility / confidence multiplier chain,
# which until now was computed for the dashboard but never allowed to change
# what a live trade risks. The multipliers modulate the staged fixed-dollar
# risk above; they do not replace it with a BASE_RISK_PCT lookup (that table
# has no forex bucket, and most of mt5_watchlist is forex).
#
# TWO caps apply, and both are needed:
#   - final_risk_pct()'s MAX_COMBINED_MULTIPLIER (3.0) is RELATIVE — against
#     $3 staged risk it authorises $9, which exceeds this account outright.
#   - max_multiple / max_risk_usd below are ABSOLUTE, in dollars. These are
#     the ones that actually bound the downside on a small balance.
# OFF: effective_risk_pct is exactly risk_pct_for_fixed_usd()'s result.
position_sizing:
  enabled: true
  # 1.0, lowered from 1.5 at explicit user request after live sizing was
  # observed pushing a trade from the staged $3.00 to $4.18 — 67% of an $8.27
  # account — driven by the confidence multiplier (x1.45 at 97.7% confidence).
  # At 1.0 the multiplier chain can still REDUCE risk below the staged figure
  # when volatility or regime argue for it, but can never raise it above.
  # The backtest had shown these multipliers reducing risk ($3.00 -> $2.08);
  # live they amplified instead, so the relative cap is pinned at parity.
  max_multiple: 1.0
  max_risk_usd: 5.0      # ...and never more than this many dollars, ever

# --- Positions this bot did not place
# The account is also traded by hand, and MT5 reports every position on it,
# not just this bot's. Orders from here carry magic 770077 (bot/mt5/client.py's
# BOT_MAGIC); anything else reads as "manual" -- a human, another EA, or a
# copy-trade feed.
#
# true (default): manual positions count toward max_open_trades, and the bot
# never opens on a symbol that already has one. It still manages only its own
# positions -- it will not touch, modify, or close a manual trade.
# false: the bot ignores them entirely and can stack on top of your trades.
respect_manual_positions: true

# --- Realised-outcome grading (bot/trade_grades.py)
# The ingested corpus weights each SMC concept by how often it is DISCUSSED
# across ~1000 transcripts. That is popularity, not performance: the corpus
# holds no win rate, no P&L, no backtest result. This records what this
# account's own closed trades actually did, per detector, so those weights can
# eventually be graded against outcomes instead of mentions.
#
# It records only. Nothing here changes sizing, entry, or exit, and no grade
# is reported for a detector until it has MIN_SAMPLE (10) closed trades --
# a 100% win rate off one trade is noise, and publishing it would look like
# evidence.
trade_grades: true
trade_grades_path: trade_grades.json
