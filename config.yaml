symbol: BTC/USDT
timeframe: 15m
higher_timeframe: 1h

# Venue: cex (Binance via CCXT) | evm (on-chain DEX) | mt5 (MetaTrader 5 bridge)
venue: mt5

# SMC parameters
swing_lookback: 5
order_block_lookback: 20
fvg_min_size_pct: 0.001
liquidity_tolerance_pct: 0.0005

# Risk management
risk_per_trade_pct: 1.0
reward_risk_ratio: 2.0
max_open_trades: 1

# Fixed stop-loss distance from entry for every live trade, REPLACING the
# order-block/FVG-boundary invalidation stop SMCStrategy would otherwise use
# — set at explicit user request, paired with screening.max_stop_pct below
# (raised from 2% to 25% so the Sniper-entry gate can still pass a 20% stop).
# null/omitted keeps the original structural stop (used by backtests,
# scan.py, and market_snapshot.py's informational second-opinion strategy,
# none of which read this key).
stop_loss_pct: 0.20

# Staged fixed-dollar risk per trade, overriding risk_per_trade_pct above
# when enabled — set at explicit user request: $3/trade while combined
# capital+profit (both venues, via bot/combined_ledger.py) is below
# threshold_usd, $6/trade once it reaches or exceeds it. Recomputed fresh
# every pass against the live combined balance (bot/position_sizing.py's
# staged_fixed_risk_usd/risk_pct_for_fixed_usd).
fixed_risk_usd:
  enabled: true
  low: 3.0
  high: 6.0
  threshold_usd: 100.0

# Paper trading
initial_balance: 10000.0
poll_interval_sec: 30

# EVM settings (when venue: evm)
evm_chain: base
evm_slippage_pct: 0.5

# MT5 settings (when venue: mt5) — connection details go in .env
# Symbol name must match your broker exactly, including any suffix
# (e.g. EURUSD, XAUUSD, BTCUSD, EURUSD.r). Timeframe reuses the same
# strings as above (1m/5m/15m/30m/1h/4h/1d).
# mt5_backend: bridge (default) needs a Windows box running mt5linux, set
#              MT5_HOST/MT5_PORT/MT5_LOGIN/MT5_PASSWORD/MT5_SERVER in .env.
#              metaapi needs no box of your own — set METAAPI_TOKEN plus the
#              same MT5_LOGIN/MT5_PASSWORD/MT5_SERVER in .env.
mt5_backend: bridge
mt5_symbol: EURUSDc
mt5_timeframe: 15m
# Cent account: the broker reports balance/PnL in cents, not dollars
# (100 units = $1). Position sizing is unaffected — tick_value is reported
# in the same cent units, so the risk math is already self-consistent — this
# flag only fixes the human-facing $ balance/PnL printouts.
mt5_cent_account: true
# Symbols to scan every poll cycle (each gets its own position slot; overrides
# mt5_symbol above when set). Confirmed against this account's actual symbol
# list — this broker's Cent account naming uses a trailing "c" suffix.
# US30 (and every other index CFD) is NOT available on Exness Cent accounts —
# checked directly against the account's symbol universe, not just Market
# Watch — so it's left out; it needs a Standard/Zero/Pro account type instead.
mt5_watchlist: [EURUSDc, USDJPYc, GBPUSDc, GBPJPYc, XAUUSDc, BTCUSDc, ETHUSDc]

# Backtest defaults
backtest_bars: 2000

# Hyperliquid DeFi wallet + perps (long/short on one venue)
hyperliquid:
  testnet: false
  default_leverage: 3
  # Majors — PAXG is tokenized gold; XMR is a listed perp (no Monero-chain custody)
  majors: [BTC, ETH, SOL, HYPE, WLD, XMR, PAXG]
  # Sample memecoins (k-prefixed = 1000x-denominated on Hyperliquid)
  memecoins: [kPEPE, WIF, POPCAT, FARTCOIN, TRUMP, DOGE, GOAT, MOODENG, PNUT, kBONK, kSHIB, MELANIA, BRETT]

# Trade screening — a signal must clear ALL of these before it is approved to trade
screening:
  min_confidence: 0.55     # SMC confluence score floor
  min_rr: 2.0              # minimum reward:risk
  sniper_confidence: 0.65  # confidence required for a "sniper" entry
  max_stop_pct: 0.25       # raised from 2% to fit the fixed stop_loss_pct (0.20) above
  ote_low: 0.618           # Fibonacci golden-pocket bounds (OTE zone)
  ote_high: 0.786
  liquidity_tolerance_pct: 0.0005  # equal-high/low tolerance for liquidity pools
  sweep_bars: 20           # a liquidity sweep must be this recent to confirm
  # Optional gates 8-10, all OFF. Each ADDS a condition, so enabling one can
  # only ever reject trades the seven-gate screen would have approved -- never
  # approve one it rejected. That is still a real behaviour change on two armed
  # accounts, so turn them on ONE AT A TIME and walk-forward before going live.
  #
  # Built from the ingested corpus (157 videos / 102 hours): mitigation appears
  # in 143 of them, breakers in 78, candle-close confirmation in 49 -- and this
  # codebase modelled none of the three until now.
  # require_mitigation: true          # entry must sit in a zone price returned to AND respected
  # require_breaker: true             # entry must sit in a retested, polarity-flipped zone
  # require_candle_confirmation: true # a candle must confirm the direction before entry
  # candle_lookback: 3
  # candle_min_strength: 0.0          # raise toward 1.0 to demand a stronger pattern
  #
  # Gates 11-12, from the same corpus. Volume profile appears in 84 of 157
  # videos and Wyckoff in 61, and neither was modelled here until now.
  # NOTE on forex: bot/mt5/client.py maps MT5's tick_volume to `volume`, and
  # tick volume counts price CHANGES, not contracts. A value area on EURUSDc is
  # a proxy; on the CEX side the volume is genuine. Same code, different
  # confidence.
  # require_wyckoff: true             # range bias (spring/upthrust) must agree with the trade
  # require_value_area_edge: true     # long at the value-area LOW, short at the HIGH
  # volume_profile_bins: 50

# Capital guard — daily-loss / drawdown circuit breaker + concurrent-risk caps.
# Checked right before a --live order is sent; once halted it blocks new
# entries until a new trading day starts or the balance recovers off its peak.
capital_guard:
  max_daily_loss_pct: 3.0
  max_drawdown_pct: 10.0
  max_concurrent_trades: 3
  # Raised from 3.0 at explicit user request: fixed_risk_usd above means a
  # single trade's risk_pct is now $3/combined_balance -- at the account's
  # current ~$8 combined balance that's ~37.5%, which the old 3% cap would
  # have blocked outright (silently, with no trade ever firing). This is a
  # REAL loosening of a capital-preservation control, not a cosmetic
  # change -- max_daily_loss_pct/max_drawdown_pct above are UNCHANGED and
  # still the backstop if a trade goes against the account.
  max_concurrent_open_risk_pct: 40.0
  # Everything below is OFF by default (uncomment to enable) — added for the
  # "self-evolving bot" blueprint's Section 7 breakers. Each is independent;
  # turning one on doesn't change the others' behavior.
  # max_weekly_loss_pct: 6.0             # halts for a fixed 48h once tripped
  # consecutive_loss_limit: 3            # halves new-trade size until 2 wins in a row
  # vix_halt_threshold: 30.0             # needs `vix=` passed into CapitalGuard.update()
  # correlated_crash_btc_pct: -5.0       # both this AND spx_pct must trip together
  # correlated_crash_spx_pct: -3.0
  # liquidity_shock_spread_pct: 0.1
  # liquidity_shock_volume_drop_pct: -50.0
  # profit_lock_trigger_pct: 20.0        # check_profit_lock() reports a lock amount; a human executes the move
  # profit_lock_fraction: 0.10

# Trading-knowledge ingestion (bot/knowledge/, scripts/knowledge_ingest.py).
# REPORT ONLY. Nothing under bot/knowledge/ is imported by the live trading
# path, and nothing there writes this file -- the pipeline produces ranked,
# cited rule candidates and prints the config edit for a human to make, the
# same boundary capital_guard's profit-lock and entry_rules already draw.
knowledge:
  enabled: true
  # Path to a yt-dlp BINARY (never imported -- it ships its own interpreter and
  # is updated far more often than this repo). Blank searches PATH; $YTDLP_PATH
  # in .env also works. On this machine the only existing copy lives in an
  # unrelated project's venv, so point at it explicitly or `pip install yt-dlp`.
  # Points at venv-knowledge/, a SEPARATE venv from the trading venv. Whisper
  # drags in ctranslate2/onnxruntime and can move numpy, and venv/ is what runs
  # com.smc.autotrader -- so the ingestion toolchain is kept out of it entirely.
  # Both venvs live inside this project; neither reaches into another repo.
  ytdlp_path: "/Users/mac/Projects/smc-trading-bot/venv-knowledge/bin/yt-dlp"
  data_dir: knowledge
  search_limit: 25
  max_videos_per_channel: 60   # 3 new channels; 250 each would re-trigger the bot-check
  min_video_seconds: 120       # skip Shorts -- no rule is taught in 45 seconds
  max_video_seconds: 10800
  segment_seconds: 30.0        # concept matching + quoting happen on these chunks
  segment_max_chars: 600
  min_support_videos: 2        # one throwaway sentence is not a finding
  whisper:
    # Fallback ASR for videos with NO captions. Off by default: captions are
    # seconds per video, Whisper is minutes, and max_videos_per_run stops a
    # routine ingest quietly becoming an overnight job. Full coverage of an
    # uncaptioned backlog is reached across runs, on purpose.
    # ON, and uncapped for a full-channel backfill. Only ~10% of this channel's
    # videos have captions, so without ASR the corpus would cover a tenth of it.
    # This is an hours-long run by nature: faster-whisper base on CPU is roughly
    # 5-10x realtime, so ~200 uncaptioned videos is 8-12h. Lower
    # max_videos_per_run back to single digits for routine incremental runs.
    enabled: true
    model: base
    # Bounded per run, on purpose. 250 turned a single ingest into an
    # open-ended job, and when YouTube started bot-checking, the run churned
    # through ~100 videos failing before anyone noticed. 25 is a few hours at
    # worst, makes real progress on the uncaptioned backlog across repeated
    # runs, and pairs with max_consecutive_failures so a blocked run stops
    # early instead of hammering the source.
    max_videos_per_run: 25
  llm:
    # Optional local ollama pass. It never DETECTS concepts (taxonomy.py does
    # that, deterministically) -- it only proposes a value for a segment that
    # already scored one, and its output is discarded unless the parameter name
    # is on the allow-list, the value is in range, AND the number appears
    # verbatim in the quoted text.
    enabled: true
    endpoint: "http://127.0.0.1:11434"
    model: "qwen2.5:14b"
    max_segments_per_video: 40
